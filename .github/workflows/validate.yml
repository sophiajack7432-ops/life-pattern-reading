name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill package
        run: python scripts/validate_skill.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Lint examples
        run: |
          python scripts/check_report.py examples/full-reading.md
          python scripts/check_report.py examples/partial-data.md
          python scripts/check_report.py examples/boundary-time.md

      - name: Build release artifacts
        run: python scripts/package.py

      - name: Upload ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: life-pattern-reading-zips
          path: dist/*.zip
          if-no-files-found: error
